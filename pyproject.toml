[project]
name = "zeroshield"
version = "1.0.0"
description = "ZeroShield: Zero-Day Exploit Detection Using Transformer-Based Network Traffic Classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "requests>=2.31.0",
    "joblib>=1.3.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
